[package]
name = "process-viewer"
version = "0.0.0"
description = "Process viewer example for Tauri"
authors = ["you"]
edition = "2021"
rust-version = "1.77"
publish = false

[workspace]

[build-dependencies]
tauri-build = { path = "../../../crates/tauri-build" }

[dependencies]
tauri = { path = "../../../crates/tauri", features = ["custom-protocol"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.33.1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[patch.crates-io]
tauri = { path = "../../../crates/tauri" }
tauri-plugin = { path = "../../../crates/tauri-plugin" }
tauri-utils = { path = "../../../crates/tauri-utils" }
